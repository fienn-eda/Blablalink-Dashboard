name: Daily Nikke Crawler

on:
  # 1. 스케줄링 설정 (UTC 기준)
  schedule:
    # 매일 한국 시간 자정(00:00)에 실행 = UTC 시간으로는 전날 15:00
    - cron: '0 15 * * *'
  
  # 2. 수동 실행 버튼 (원할 때 언제든 깃허브 화면에서 클릭으로 실행 가능)
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest # 깃허브가 제공하는 리눅스 서버 사용

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치 (requirements.txt 기반)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 크롤러 스크립트 실행
      # 깃허브 시크릿에 저장된 키를 환경 변수로 주입하여 실행
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        # 실행할 크롤러 파이썬 파일의 정확한 이름
        python crawler.py